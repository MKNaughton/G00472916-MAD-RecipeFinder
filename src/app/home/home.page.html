<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      G00472916
    </ion-title>

<ion-content [fullscreen]="true">

<!--Again rather then using a plain Html button- the Ionic compenent:ion-button renders a better looking button
 Ref:https://ionicframework.com/docs/components-->
  <ion-button (click)="searchRecipes()">SEARCH</ion-button>


</ion-content>
